[package]
name = "shoko_forms_desktop"
version = "0.1.0"
description = "Desktop backup manager for Shoko Forms"
authors = ["Shoko Forms"]
edition = "2021"

[lib]
name = "shoko_forms_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

