<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoko Forms Desktop</title>
    <style>
      .boot-fallback {
        align-items: center;
        background: #f3f5f7;
        color: #1b1f23;
        display: grid;
        font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        gap: 10px;
        height: 100vh;
        justify-items: center;
        margin: 0;
        padding: 24px;
        text-align: center;
      }
      .boot-fallback strong {
        font-size: 18px;
      }
      .boot-fallback code {
        color: #b42318;
        max-width: 720px;
        overflow-wrap: anywhere;
      }
    </style>
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<main class="boot-fallback"><strong>Shoko Forms 啟動失敗</strong><code>' +
          String(event.message || "Unknown startup error") +
          "</code></main>";
      });
    </script>
  </head>
  <body>
    <div id="root">
      <main class="boot-fallback">
        <strong>Shoko Forms 正在啟動</strong>
        <span>正在載入桌面版資源...</span>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
